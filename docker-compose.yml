version: '3.8'

services:
  visitor-system:
    build: .
    container_name: visitor-system
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      # 持久化数据目录
      - ./server/data:/app/server/data
    networks:
      - visitor-network

networks:
  visitor-network:
    driver: bridge
