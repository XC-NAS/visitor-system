services:
  - type: web
    name: visitor-system
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    disk:
      name: data
      mountPath: /app/server/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
    healthCheckPath: /
