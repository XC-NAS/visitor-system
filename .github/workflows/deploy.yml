name: Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Build Docker Image
      run: docker build -t visitor-system .

    - name: Test Docker Image
      run: |
        docker run -d -p 3000:3000 --name test visitor-system
        sleep 5
        curl -f http://localhost:3000 || exit 1
        docker stop test
        docker rm test
